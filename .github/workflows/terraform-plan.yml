name: "Terraform plan"

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
      tfvars_file:
        required: true
        type: string
    secrets:
      aws_sts_credentials_json:
        required: true
      gh_pr_token:
        required: true

env:
  TF_LOG: INFO

jobs:
  terraform:
    name: "Terraform plan job"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the repository to the runner
        uses: actions/checkout@v6

      # - name: Mask extracted credentials
      #   run: |
      #     echo "::add-mask::${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.AccessKeyId }}"
      #     echo "::add-mask::${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.SecretAccessKey }}"
      #     echo "::add-mask::${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.SessionToken }}"

      - name: Set AWS credentials as environment variables
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.AccessKeyId }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.SecretAccessKey }}" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=${{ fromJSON(secrets.aws_sts_credentials_json).Credentials.SessionToken }}" >> "$GITHUB_ENV"

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform init
        id: init
        run: terraform init -backend-config="./init-tfvars/${{ inputs.tfvars_file }}"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -var-file "./apply-tfvars/${{ inputs.tfvars_file }}"
        continue-on-error: true

      - name: Write plan summary
        if: github.event_name != 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          VALIDATE: ${{ steps.validate.outputs.stdout }}
        run: |
          {
            echo "#### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`"
            echo "#### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`"
            echo "#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`"
            echo ""
            echo "<details><summary>Show Plan</summary>"
            echo ""
            echo '```terraform'
            echo "$PLAN"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          VALIDATE: ${{ steps.validate.outputs.stdout }}
        with:
          github-token: ${{ secrets.gh_pr_token }}
          script: |
            const output = `#### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })