  terraform-apply:
    name: "Terraform apply job"
    # needs: [terraform-plan, check-pr-approval]
    needs: [terraform-plan]
    # if: >
    #   (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
    #   needs.terraform-plan.result == 'success' &&
    #   needs.check-pr-approval.outputs.approved == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the repository to the runner
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: actions/github-script@v9
        env:
          AWS_STS_CREDENTIALS_JSON: ${{ secrets.aws_sts_credentials_json }}
        with:
          script: |
            const { AccessKeyId, SecretAccessKey, SessionToken } =
              JSON.parse(process.env.AWS_STS_CREDENTIALS_JSON).Credentials;

            core.setSecret(AccessKeyId);
            core.setSecret(SecretAccessKey);
            core.setSecret(SessionToken);

            core.exportVariable("AWS_ACCESS_KEY_ID", AccessKeyId);
            core.exportVariable("AWS_SECRET_ACCESS_KEY", SecretAccessKey);
            core.exportVariable("AWS_SESSION_TOKEN", SessionToken);

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform init
        run: terraform init -backend-config="./init-tfvars/${{ inputs.tfvars_file }}"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: Terraform apply
        id: apply
        run: terraform apply -no-color tfplan

      - name: Write apply summary
        if: github.event_name != 'pull_request'
        env:
          APPLY: ${{ steps.apply.outputs.stdout }}
        run: |
          {
            echo "#### Terraform Apply ✅\`${{ steps.apply.outcome }}\`"
            echo ""
            echo "<details><summary>Show Apply</summary>"
            echo ""
            echo '```terraform'
            echo "$APPLY"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment apply on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          APPLY: ${{ steps.apply.outputs.stdout }}
        with:
          github-token: ${{ secrets.gh_pr_token }}
          script: |
              const applySection = '${{ steps.apply.outcome }}' === 'success'
              ? `

            const output = `#### Terraform Apply ✅\`${{ steps.apply.outcome }}\`

            <details><summary>Show Apply</summary>

            \`\`\`terraform
            ${process.env.APPLY}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
